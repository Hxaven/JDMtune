<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDM tune | Premium Automotive Model Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .header-fixed { position: fixed; top: 0; width: 100%; z-index: 60; border-bottom: 1px solid #E5E5E5; height: 80px; }
        .logo-box { width: 180px; display: flex; justify-content: center; align-items: center; }
        #search-bar { position: fixed; top: 80px; left: 0; width: 100%; z-index: 55; transition: all 0.3s ease; transform: translateY(-100%); opacity: 0; }
        #search-bar.active { transform: translateY(0); opacity: 1; }
        .hero-banner { height: 40vh; margin-top: 80px; background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://www.shutterstock.com/shutterstock/photos/2186455865/display_1500/stock-photo-mt-fuji-with-red-maple-tree-in-autumn-lake-kawaguchiko-japan-2186455865.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: white; }
        .filter-btn.active { background-color: #BC002D; color: white; border-color: #BC002D; }
        .sub-filter-btn.active { border-color: #BC002D; color: #BC002D; font-weight: 800; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1); top: 100%; border-radius: 4px; z-index: 70; }
        .dark .dropdown-content { background-color: #18181b; border: 1px solid #27272a; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content button { width: 100%; text-align: left; padding: 12px 16px; border: none; background: none; font-size: 11px; font-weight: bold; cursor: pointer; color: inherit; }
        .dropdown-content button:hover { background-color: #f4f4f5; color: #BC002D; }
        .modal { display: none; position: fixed; z-index: 100; inset: 0; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
        .modal-content { margin: 5vh auto; width: 95%; max-width: 1000px; border-radius: 12px; overflow: hidden; background: white; }
        .dark .modal-content { background: #18181b; }
    </style>
</head>
<body class="bg-white text-[#1A1A1A] dark:bg-zinc-900 dark:text-zinc-100">

    <header class="header-fixed flex items-center px-6 bg-white/95 dark:bg-zinc-900/95 dark:border-zinc-800">
        <div class="container mx-auto flex justify-between items-center">
            <div class="hidden md:flex flex-1 items-center space-x-6 text-[10px] font-bold tracking-[0.2em] uppercase">
                <a href="#" onclick="resetFilters()" class="hover:text-red-600 transition-colors">All Models</a>
                <div class="dropdown">
                    <button class="hover:text-red-600 uppercase">Tuning Lab <i class="fas fa-chevron-down ml-1 text-[8px]"></i></button>
                    <div class="dropdown-content">
                        <button onclick="applyTunerFilter('Top Secret')">Top Secret</button>
                        <button onclick="applyTunerFilter('Liberty Walk')">Liberty Walk</button>
                        <button onclick="applyTunerFilter('Pandem')">Pandem</button>
                        <button onclick="applyTunerFilter('Rocket Bunny')">Rocket Bunny</button>
                    </div>
                </div>
            </div>
            <div class="logo-box">
                <a href="#" onclick="resetFilters()" class="text-2xl font-black italic tracking-tighter uppercase">JDM<span class="text-[#BC002D]">tune</span></a>
            </div>
            <div class="flex flex-1 justify-end items-center space-x-6">
                <button id="theme-toggle" class="text-lg hover:text-red-600 transition-colors"><i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:block"></i></button>
                <button id="search-toggle" class="text-lg hover:text-red-600 transition-colors"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <div id="search-bar" class="bg-zinc-100 dark:bg-zinc-800 border-b dark:border-zinc-700">
        <div class="container mx-auto px-6 py-4">
            <input type="text" id="search-input" placeholder="모델명을 입력하세요..." class="w-full bg-transparent border-none focus:ring-0 text-xl outline-none">
        </div>
    </div>

    <section class="hero-banner text-center px-4">
        <div>
            <h1 id="hero-title" class="text-4xl md:text-6xl font-bold mb-2 tracking-tighter italic uppercase">JDM SPIRIT</h1>
            <p class="text-[10px] md:text-xs font-light tracking-[0.4em] uppercase opacity-90">Authentic Tuning Model Curator</p>
        </div>
    </section>

    <main class="container mx-auto py-12 px-6">
        <div class="flex flex-col md:flex-row justify-between items-end mb-10 gap-6 border-b pb-8 dark:border-zinc-800">
            <div>
                <h2 class="text-2xl font-bold mb-4 italic uppercase">Model Select</h2>
                <div class="flex flex-col gap-4">
                    <div class="flex flex-wrap gap-2" id="filter-maker">
                        <button class="filter-btn active border px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider dark:border-zinc-700" data-filter="all">ALL</button>
                        <button class="filter-btn border px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider dark:border-zinc-700" data-filter="Nissan">NISSAN</button>
                        <button class="filter-btn border px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider dark:border-zinc-700" data-filter="Toyota">TOYOTA</button>
                        <button class="filter-btn border px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider dark:border-zinc-700" data-filter="Mazda">MAZDA</button>
                    </div>
                </div>
            </div>
            <div class="text-right text-gray-400 text-[10px] tracking-widest uppercase">Result: <span id="item-count" class="text-black dark:text-white font-bold">0</span></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-12" id="product-grid"></div>
    </main>

    <div id="carModal" class="modal"><div class="modal-content"><div id="modal-body" class="flex flex-col md:flex-row"></div></div></div>

    <script>
        const carData = [
            // NISSAN
            { 
                id: 1, 
                name: "Skyline GT-R R34", 
                maker: "Nissan", 
                category: "Nissan", 
                kits: ["Normal Type", "Top Secret", "Liberty Walk"], 
                image: "r34-nissan-skyline-gt-r-from-fast-and-furious-4--photo-credit-bonhams_100879630.jpg", 
                kitStories: {
                    "Normal Type": "1999년 출시된 R34는 RB26DETT 엔진과 ATTESA E-TS AWD 시스템을 탑재한 JDM의 아이콘입니다. '고질라'라는 별칭에 걸맞게 당시 일본 마력 규제치인 280마력을 꽉 채운 성능을 자랑하며, 숏 휠베이스 설계로 날카로운 핸들링을 완성했습니다.",
                    "Top Secret": "치바 현의 전설적인 튜너 '스모키 나가타'가 제작한 버전으로, 초고속 주행에 최적화된 에어로다이내믹 설계가 특징입니다. 특유의 골드 컬러 도색과 거대한 GT 윙은 아우토반이나 고속도로 최고속 도전을 위한 상징과도 같습니다.",
                    "Liberty Walk": "클래식한 '샤코탄' 스타일을 현대적으로 재해석하여 거대한 오버휀더와 과감한 리벳 자국을 노출한 바디킷입니다. 레이싱카의 실루엣을 도로 위로 가져온 디자인으로, 극단적으로 낮은 차고와 화려한 드레스업이 핵심입니다."
                },
                customKits: { 
                    "Top Secret": "1482-1_1200x1200.webp", 
                    "Liberty Walk": "ER34_silhouette_3.jpg"
                } 
            },
            { 
                id: 2, 
                name: "Skyline GT-R R33", 
                maker: "Nissan", 
                category: "Nissan", 
                kits: ["Normal Type", "Pandem", "Rocket Bunny"], 
                image: "Photo-4-01-23-6-39-27-PM-scaled.jpg", 
                kitStories: {
                    "Normal Type": "R32보다 휠베이스를 늘려 고속 주행 안정성을 대폭 개선한 모델로, 뉘르부르크링에서 8분대의 벽을 처음으로 깬 GT-R입니다. RB26 엔진의 신뢰성을 높였으며, 보다 유선형에 가까운 바디 라인으로 공기 저항을 줄였습니다.",
                    "Pandem": "미우라 케이가 디자인한 팬덤 킷은 R33의 묵직한 바디 라인을 더욱 강조하는 각진 오버휀더가 특징입니다. 레트로 레이싱 감성을 자극하며, 차량의 하단부를 더욱 넓고 낮게 보이게 하여 시각적인 압도감을 줍니다.",
                    "Rocket Bunny": "팬덤과 형제 브랜드격인 로켓 버니는 특유의 '덕테일' 스포일러와 매끈하게 이어지는 휀더 라인을 선사합니다. 드리프트 문화에서 영감을 받은 디자인으로, R33의 대형 차체를 역동적이고 날렵하게 변모시킵니다."
                },
                customKits: {
                    "Pandem": "1333-1_1200x1200.webp"
                }
            },
            { 
                id: 3, 
                name: "Skyline GT-R R32", 
                maker: "Nissan", 
                category: "Nissan", 
                kits: ["Normal Type", "Pandem"],
                image: "BNR32_01.jpg",
                kitStories: {
                    "Normal Type": "1989년, 16년 만에 부활한 GT-R로 그룹 A 레이싱을 제패하기 위해 태어난 전설의 시작점입니다. 2.6L 직렬 6기통 트윈터보 엔진과 혁신적인 4륜 구동 시스템을 결합하여 일본 스포츠카의 황금기를 열었습니다.",
                    "Pandem": "클래식한 R32의 외형에 현대적인 와이드 바디 기술을 접목하여 근육질의 실루엣을 완성합니다. 노출된 볼트 체결 방식의 휀더는 거친 레이싱 머신의 느낌을 주며, 차량의 공격적인 스탠스를 극대화합니다."
                },
                customKits: {
                    "Pandem": "1642-1_1200x1200.webp"
                }
            },
            // TOYOTA
            { 
                id: 6, 
                name: "Supra A80", 
                maker: "Toyota", 
                category: "Toyota", 
                kits: ["Normal Type", "Top Secret", "Rocket Bunny"], 
                image: "Supra_silver.jpg", 
                kitStories: {
                    "Normal Type": "'직빨의 제왕'이라 불리는 3.0L 2JZ-GTE 엔진을 탑재하여 튜닝 잠재력이 무궁무진했던 90년대 대표 스포츠카입니다. 거대한 순정 리어 윙과 둥근 유선형 디자인은 시대를 앞서간 세련미를 보여주며 컬트적인 인기를 끌었습니다.",
                    "Top Secret": "전설적인 'V12 수프라' 제작사답게 최고속 주행을 위한 독보적인 바디킷을 제공합니다. 전면부 공기 흡입구를 극대화하고 공기 저항을 최소화한 디자인으로, 황금색 수프라는 튜닝카 역사에 남을 명작입니다.",
                    "Rocket Bunny": "수프라 고유의 곡선을 유지하면서도 과감한 폭의 오버휀더를 추가해 하체를 강조합니다. 차량의 뒷모습을 더욱 웅장하게 만드는 와이드 킷과 정교한 디테일은 수프라를 현대적인 스트릿 튜닝카로 재탄생시킵니다."
                },
                customKits: {
                    "Top Secret": "Supra_yellow.jpg", 
                    "Rocket Bunny": "Supra_blue.jpg" 
                }
            },
            { 
                id: 16, 
                name: "GR Supra A90", 
                maker: "Toyota", 
                category: "Toyota", 
                kits: ["Normal Type", "Liberty Walk", "Pandem"], 
                image: "Supra_A90_normal.jpg", 
                kitStories: {
                    "Normal Type": "17년 만에 부활한 5세대 수프라로, BMW와의 협업을 통해 직렬 6기통 엔진과 후륜구동 레이아웃을 계승했습니다. 짧은 휠베이스와 넓은 트레드, 완벽한 앞뒤 무게 배분으로 순정 상태에서도 탁월한 코너링 성능을 발휘합니다.",
                    "Liberty Walk": "A90의 복잡한 곡면을 따라 흐르는 와이드 바디킷으로, 로우 앤 와이드(Low & Wide) 스타일의 정점을 보여줍니다. 프런트 디퓨저와 사이드 스커트가 지면과 맞닿을 듯한 낮은 자세는 압도적인 존재감을 뿜어냅니다.",
                    "Pandem": "출시와 동시에 세계적인 화제가 된 킷으로, 순정 디자인을 완전히 뒤엎는 과감한 휀더 커팅과 거대한 윙이 특징입니다. 드리프트 경기에 바로 투입될 법한 전투적인 외형을 완성하며 현대 JDM 튜닝의 트렌드를 이끌고 있습니다."
                },
                customKits: {
                    "Liberty Walk": "Supra_A90_LB.jpg", 
                    "Pandem": "Supra_A90_pandem.jpg"    
                }
            },
            // MAZDA
            { 
                id: 10, 
                name: "RX-7 FD3S", 
                maker: "Mazda", 
                category: "Mazda", 
                kits: ["Normal Type", "Liberty Walk", "Rocket Bunny"], 
                image: "FD3S_silver.jpg", 
                kitStories: {
                    "Normal Type": "세계에서 유일하게 2로터 13B-REW 로터리 엔진을 탑재한 양산차로, 예술적인 바디 라인 덕분에 '가장 아름다운 일본차'로 꼽힙니다. 가벼운 무게와 고회전 엔진의 특성을 살려 경쾌한 와인딩 로드 주행에 최적화되어 있습니다.",
                    "Liberty Walk": "로터리 엔진 특유의 날렵함에 리버티 워크만의 중후한 와이드 스타일을 더했습니다. 매끈한 FD의 표면에 리벳 타입 휀더를 부착하여 상반된 매력을 발산하며, 고급스러운 스트릿 튜닝의 진수를 보여줍니다.",
                    "Rocket Bunny": "FD3S 전용 로켓 버니 킷은 차량의 전면 인상을 완전히 바꾸는 전용 범퍼와 오버휀더를 포함합니다. 고전적인 레이싱카의 향수와 현대적인 세련미를 동시에 담아내어, FD를 마치 트랙 전용 머신처럼 보이게 합니다."
                },
                customKits: {
                    "Rocket Bunny": "FD3S_red.jpg", 
                    "Liberty Walk": "FD3S_black_LB.jpg" 
                }
            }
        ];

        let currentFilter = 'all';
        let currentTunerFilter = 'all';
        const grid = document.getElementById('product-grid');
        const searchInput = document.getElementById('search-input');

        function render() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = carData.filter(car => {
                const matchesMaker = (currentFilter === 'all' || car.category === currentFilter);
                const matchesTuner = (currentTunerFilter === 'all' || car.kits.includes(currentTunerFilter));
                const matchesSearch = car.name.toLowerCase().includes(searchTerm);
                return matchesMaker && matchesTuner && matchesSearch;
            });

            document.getElementById('item-count').innerText = filtered.length;
            grid.innerHTML = filtered.map(car => `
                <div class="group cursor-pointer" onclick="openModal(${car.id})">
                    <div class="aspect-[4/3] mb-4 bg-zinc-100 dark:bg-zinc-800 overflow-hidden rounded-sm">
                        <img src="${car.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                    </div>
                    <p class="text-[9px] font-bold text-[#BC002D] mb-1 tracking-widest uppercase">${car.maker}</p>
                    <h3 class="text-sm font-bold group-hover:text-red-600 transition-colors uppercase">${car.name}</h3>
                </div>
            `).join('');
        }

        window.applyTunerFilter = (tuner) => {
            currentTunerFilter = tuner;
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-filter="all"]').classList.add('active');
            document.getElementById('hero-title').innerText = tuner;
            render();
        };

        window.resetFilters = () => {
            currentFilter = 'all';
            currentTunerFilter = 'all';
            document.getElementById('hero-title').innerText = "JDM SPIRIT";
            render();
        };

        window.openModal = (id) => {
            const car = carData.find(c => c.id === id);
            document.getElementById('modal-body').innerHTML = `
                <div class="md:w-3/5 bg-black overflow-hidden flex items-center">
                    <img id="modal-main-img" src="${car.image}" class="w-full h-auto object-cover">
                </div>
                <div class="md:w-2/5 p-8 md:p-12 relative bg-white dark:bg-zinc-900">
                    <button onclick="closeM()" class="absolute top-6 right-6 text-2xl">&times;</button>
                    <span id="modal-status-text" class="text-[10px] font-bold text-red-600 uppercase border-b border-red-600 pb-1">AUTHENTIC MODEL</span>
                    <h2 class="text-3xl font-black mt-6 mb-4 uppercase leading-tight">${car.name}</h2>
                    <div class="mb-8 flex flex-wrap gap-2">
                        ${car.kits.map(kit => `<button onclick="changeKitView('${kit}', ${car.id})" class="px-4 py-2 border text-[10px] font-bold hover:bg-black hover:text-white dark:border-zinc-700 transition-all uppercase">${kit}</button>`).join('')}
                    </div>
                    <p id="modal-desc" class="text-sm text-gray-600 dark:text-zinc-400 mb-10 leading-relaxed">${car.kitStories["Normal Type"]}</p>
                </div>
            `;
            document.getElementById('carModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        window.changeKitView = (kitName, carId) => {
            const car = carData.find(c => c.id === carId);
            const mainImg = document.getElementById('modal-main-img');
            const status = document.getElementById('modal-status-text');
            const desc = document.getElementById('modal-desc');

            if (kitName === "Normal Type") {
                mainImg.src = car.image;
                status.innerText = "AUTHENTIC MODEL";
            } else {
                mainImg.src = (car.customKits && car.customKits[kitName]) ? car.customKits[kitName] : car.image;
                status.innerText = `${kitName.toUpperCase()} EDITION`;
            }
            
            // 스토리 업데이트 로직 추가
            desc.innerText = car.kitStories[kitName] || "정보가 없습니다.";
        };

        window.closeM = () => { document.getElementById('carModal').style.display = 'none'; document.body.style.overflow = 'auto'; };
        document.getElementById('search-toggle').onclick = () => document.getElementById('search-bar').classList.toggle('active');
        document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                currentTunerFilter = 'all';
                document.getElementById('hero-title').innerText = currentFilter === 'all' ? "JDM SPIRIT" : currentFilter;
                render();
            };
        });

        searchInput.oninput = render;
        render();
    </script>
</body>
</html>
